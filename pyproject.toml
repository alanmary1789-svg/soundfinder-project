[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundfinder"
version = "0.1.0"
description = "Intelligent audio sample retrieval for music production"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "librosa>=0.10,<1",
    "mutagen>=1.47,<2",
    "numpy>=1.24,<3",
    "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9",
]
demucs = [
    "demucs>=4.1,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"